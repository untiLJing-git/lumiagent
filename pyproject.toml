[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumiagent"
version = "0.1.0"
description = "LumiAgent - Multi-platform AI Agent with ReAct, RAG, and MCP support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LumiAgent Team" }]

dependencies = [
    # Core
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0",
    "structlog>=24.0",

    # Async & Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "aiofiles>=24.0",

    # CLI
    "typer>=0.12",
    "rich>=13.0",

    # LLM
    "openai>=1.30",
    "anthropic>=0.25",
    "tiktoken>=0.7",
    "jinja2>=3.1",

    # RAG & Vector
    "chromadb>=0.5",

    # Storage
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",

    # MCP
    "mcp>=1.0",

    # Tools
    "apscheduler>=3.10",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.3"]
dingtalk = ["dingtalk-stream>=1.0"]
wechat = ["wechatferry>=0.9"]
all-platforms = ["lumiagent[feishu,dingtalk,wechat]"]

eval = [
    "ragas>=0.1",
    "datasets>=2.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
lumi = "lumiagent.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
