<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumiAgent architecture — interactive diagrams</title>
  <style>
    :root {
      --bg: #020617;
      --bar: rgba(15, 23, 42, 0.94);
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #67e8f9;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --bar: rgba(255, 255, 255, 0.94);
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0891b2;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
    }
    nav {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
    }
    .brand {
      flex: 0 0 auto;
      margin-right: 4px;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      flex: 1 1 auto;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs a {
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }
    .tabs a[aria-current="page"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .open {
      flex: 0 0 auto;
      margin-left: auto;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
  </style>
</head>
<body>
  <nav aria-label="Diagrams">
    <span class="brand">LumiAgent</span>
    <div class="tabs">
      <a href="./runtime-architecture.html" data-stem="runtime-architecture">Runtime</a>
      <a href="./trace-core-model.html" data-stem="trace-core-model">Trace Core</a>
      <a href="./visualization-intent.html" data-stem="visualization-intent">Visualization</a>
      <a href="./mcp-evidence-layer.html" data-stem="mcp-evidence-layer">MCP evidence</a>
      <a href="./mcp-capture-display.html" data-stem="mcp-capture-display">MCP capture</a>
      <a href="./coding-agent-capture.html" data-stem="coding-agent-capture">Coding Agent</a>
    </div>
    <a class="open" id="open-full" href="./runtime-architecture.html">Open full page</a>
  </nav>
  <iframe id="viewer" title="Archify interactive diagram" src="./runtime-architecture.html"></iframe>
  <script>
    const frame = document.getElementById('viewer');
    const openFull = document.getElementById('open-full');
    const links = [...document.querySelectorAll('.tabs a[data-stem]')];
    const theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';

    function srcFor(stem) {
      return './' + stem + '.html?theme=' + theme;
    }

    function select(stem) {
      frame.src = srcFor(stem);
      openFull.href = srcFor(stem);
      links.forEach((link) => {
        link.setAttribute('aria-current', link.dataset.stem === stem ? 'page' : 'false');
      });
    }

    const initial = new URLSearchParams(location.search).get('d') || 'runtime-architecture';
    select(initial);

    links.forEach((link) => {
      link.addEventListener('click', (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
        event.preventDefault();
        const stem = link.dataset.stem;
        select(stem);
        history.replaceState(null, '', '?d=' + encodeURIComponent(stem));
      });
    });
  </script>
</body>
</html>
