<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">lumi show --checks</title>
  <desc id="desc">CLI preview of a coding-agent span tree: user prompt, context, edit, verification, workflow check.</desc>
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.40"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="904" height="504" rx="18" fill="url(#term)" stroke="#334155" filter="url(#lift)"/>
  <rect x="8" y="8" width="904" height="44" rx="18" fill="#1E293B"/>
  <rect x="8" y="30" width="904" height="22" fill="#1E293B"/>
  <circle cx="34" cy="30" r="6" fill="#F87171"/>
  <circle cx="54" cy="30" r="6" fill="#FBBF24"/>
  <circle cx="74" cy="30" r="6" fill="#34D399"/>
  <text x="460" y="35" text-anchor="middle" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">LumiAgent CLI - show --checks</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14">
    <text x="36" y="80" fill="#34D399">$</text>
    <text x="54" y="80" fill="#E2E8F0">python -m lumiagent.cli show session.json --checks</text>
    <text x="36" y="116" fill="#94A3B8">Run:</text>
    <text x="78" y="116" fill="#F8FAFC">Claude Code session</text>
    <text x="36" y="138" fill="#94A3B8">Status:</text>
    <text x="100" y="138" fill="#4ADE80">success</text>
    <text x="36" y="174" fill="#A78BFA" font-weight="700">Semantic Summary</text>
    <text x="52" y="196" fill="#64748B">user_prompt:</text>
    <text x="168" y="196" fill="#CBD5E1">Fix a small failing test.</text>
    <text x="36" y="232" fill="#A78BFA" font-weight="700">Span Tree</text>
    <text x="36" y="258" fill="#F8FAFC">Coding Agent Run</text>
    <text x="620" y="258" fill="#C4B5FD">coding_agent_run</text>
    <text x="36" y="284" fill="#475569">|--</text>
    <text x="68" y="284" fill="#E2E8F0">User Prompt</text>
    <text x="620" y="284" fill="#7DD3FC">user_prompt</text>
    <text x="36" y="310" fill="#475569">|--</text>
    <text x="68" y="310" fill="#E2E8F0">Context Gathering</text>
    <text x="620" y="310" fill="#7DD3FC">context_gathering</text>
    <text x="36" y="336" fill="#475569">|   +--</text>
    <text x="100" y="336" fill="#CBD5E1">Read file</text>
    <text x="620" y="336" fill="#67E8F9">file_read</text>
    <text x="36" y="362" fill="#475569">|--</text>
    <text x="68" y="362" fill="#E2E8F0">Edit code</text>
    <text x="620" y="362" fill="#FDBA74">code_edit</text>
    <text x="36" y="388" fill="#475569">|--</text>
    <text x="68" y="388" fill="#E2E8F0">Verification</text>
    <text x="620" y="388" fill="#86EFAC">verification</text>
    <text x="36" y="414" fill="#475569">|   +--</text>
    <text x="100" y="414" fill="#CBD5E1">Run tests</text>
    <text x="620" y="414" fill="#86EFAC">test_run</text>
    <text x="36" y="440" fill="#475569">+--</text>
    <text x="68" y="440" fill="#E2E8F0">Workflow Check</text>
    <text x="620" y="440" fill="#D8B4FE">workflow_check</text>
    <text x="36" y="476" fill="#94A3B8">evidence stays attached to the spans that produced it</text>
  </g>
</svg>
