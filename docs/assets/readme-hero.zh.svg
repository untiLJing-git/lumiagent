    <rect x="18" y="8" width="20" height="10" rx="3" fill="#7C3AED"/>
    <path d="M28 18V22" stroke="#8B5CF6" stroke-width="1.5"/>
    <path d="M16 22H40" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="8" y="22" width="16" height="9" rx="2.5" fill="#8B5CF6"/>
    <rect x="32" y="22" width="16" height="9" rx="2.5" fill="#8B5CF6"/>
    <path d="M40 31V35" stroke="#22C55E" stroke-width="1.5"/>
    <rect x="32" y="35" width="16" height="9" rx="2.5" fill="#22C55E"/>
  </g>
  <text class="title" x="160" y="82" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.04em">LumiAgent</text>
  <text class="sub" x="160" y="112" font-family="Inter, ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18">把 Agent 评测从分数，推进为下一步改进</text>
  <g font-family="Inter, ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">
