    <text class="chip1t" x="206" y="147" text-anchor="middle">Trace Core</text>
    <rect class="chip2" x="260" y="128" width="128" height="28" rx="14"/>
    <text class="chip2t" x="324" y="147" text-anchor="middle">MCP Tool Chain</text>
    <rect class="chip3" x="396" y="128" width="122" height="28" rx="14"/>
    <text class="chip3t" x="457" y="147" text-anchor="middle">Coding Agent</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <g class="lift">
      <g>
        <rect class="boxRun" x="168" y="196" width="220" height="64" rx="16" stroke-width="1.5"/>
        <text class="numRun" x="188" y="222" font-size="11" font-weight="700">01</text>
        <text class="boxT" x="278" y="236" text-anchor="middle" font-size="20" font-weight="600">运行</text>
      </g>
      <g>
        <rect class="box" x="530" y="196" width="220" height="64" rx="16"/>
        <text class="num" x="550" y="222" font-size="11" font-weight="700">02</text>
        <text class="boxT" x="640" y="236" text-anchor="middle" font-size="20" font-weight="600">采集</text>
      </g>
      <g>
        <rect class="box" x="892" y="196" width="220" height="64" rx="16"/>
        <text class="num" x="912" y="222" font-size="11" font-weight="700">03</text>
        <text class="boxT" x="1002" y="236" text-anchor="middle" font-size="20" font-weight="600">诊断</text>
      </g>
      <g>
        <rect class="boxGo" x="168" y="312" width="220" height="64" rx="16" stroke-width="1.5"/>
        <text class="numGo" x="188" y="338" font-size="11" font-weight="700">06</text>
        <text class="boxT" x="278" y="352" text-anchor="middle" font-size="20" font-weight="600">对比</text>
      </g>
      <g>
        <rect class="box" x="530" y="312" width="220" height="64" rx="16"/>
        <text class="num" x="550" y="338" font-size="11" font-weight="700">05</text>
        <text class="boxT" x="640" y="352" text-anchor="middle" font-size="20" font-weight="600">改进</text>
      </g>
      <g>
        <rect class="box" x="892" y="312" width="220" height="64" rx="16"/>
        <text class="num" x="912" y="338" font-size="11" font-weight="700">04</text>
        <text class="boxT" x="1002" y="352" text-anchor="middle" font-size="20" font-weight="600">审阅</text>
      </g>
    </g>
    <path class="flow" d="M388 228H530" fill="none" stroke-width="2"/>
    <path class="flow" d="M750 228H892" fill="none" stroke-width="2"/>
    <path class="flow" d="M1002 260V312" fill="none" stroke-width="2"/>
    <path class="flow" d="M892 344H750" fill="none" stroke-width="2"/>
    <path class="flow" d="M530 344H388" fill="none" stroke-width="2"/>
    <path class="flowGo" d="M278 312V260" fill="none" stroke-width="2" stroke-dasharray="5 5"/>
    <text class="rerun" x="214" y="292" font-size="12" font-weight="600">复跑</text>
  </g>
