<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" color-scheme="light dark">
  <title id="title">LumiAgent</title>
  <desc id="desc">LumiAgent 产品闭环：运行、采集、诊断、审阅、改进、对比复跑。</desc>
  <style type="text/css"><![CDATA[
  .bg { fill: url(#bgL); }
  .glow { fill: url(#glowL); }
  .glowG { fill: url(#glowGL); }
  .grid { fill: url(#gridL); opacity: 0.7; }
  .frame { fill: none; stroke: #94A3B8; stroke-width: 1.75; }
  .logo { fill: #F5F3FF; stroke: #7C3AED; }
  .title { fill: #0F172A; }
  .sub { fill: #475569; }
  .chip1 { fill: #EDE9FE; stroke: #7C3AED; }
  .chip1t { fill: #5B21B6; }
  .chip2 { fill: #DCFCE7; stroke: #15803D; }
  .chip2t { fill: #166534; }
  .chip3 { fill: #E0F2FE; stroke: #0284C7; }
  .chip3t { fill: #075985; }
  .box { fill: #FFFFFF; stroke: #CBD5E1; }
  .boxRun { fill: #FFFFFF; stroke: #7C3AED; }
  .boxGo { fill: #FFFFFF; stroke: #15803D; }
  .boxT { fill: #0F172A; }
  .num { fill: #64748B; }
  .numRun { fill: #7C3AED; }
  .numGo { fill: #15803D; }
  .flow { stroke: #94A3B8; marker-end: url(#arrowL); }
  .flowGo { stroke: #15803D; marker-end: url(#arrowGoL); }
  .rerun { fill: #15803D; }
  .lift { filter: url(#softL); }
  @media (prefers-color-scheme: dark) {
    .bg { fill: url(#bgD); }
    .glow { fill: url(#glowD); }
    .glowG { fill: url(#glowGD); }
    .grid { fill: url(#gridD); opacity: 0.45; }
    .frame { stroke: #C4B5FD; stroke-width: 2.75; }
    .logo { fill: #1E1B4B; stroke: #A78BFA; }
    .title { fill: #F8FAFC; }
    .sub { fill: #94A3B8; }
    .chip1 { fill: #1E1B4B; stroke: #A78BFA; }
    .chip1t { fill: #DDD6FE; }
    .chip2 { fill: #052E16; stroke: #34D399; }
    .chip2t { fill: #86EFAC; }
    .chip3 { fill: #082F49; stroke: #38BDF8; }
    .chip3t { fill: #7DD3FC; }
    .box { fill: #0F172A; stroke: #64748B; }
    .boxRun { fill: #0F172A; stroke: #A78BFA; }
    .boxGo { fill: #0F172A; stroke: #34D399; }
    .boxT { fill: #F8FAFC; }
    .num { fill: #94A3B8; }
    .numRun { fill: #A78BFA; }
    .numGo { fill: #34D399; }
    .flow { stroke: #94A3B8; marker-end: url(#arrowD); }
    .flowGo { stroke: #34D399; marker-end: url(#arrowGoD); }
    .rerun { fill: #34D399; }
    .lift { filter: url(#softD); }
  }
]]></style>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <radialGradient id="glowL" cx="78%" cy="18%" r="46%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="78%" cy="18%" r="46%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGL" cx="18%" cy="88%" r="38%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
